<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>课堂转写</title>
<style>
/* 布局：顶栏（模式 + 课程设置）＋ 大字字幕流；手机上开始/结束按钮固定在底部，方便单手按 */
:root{
  --bg:#f5f4f0; --panel:#fffefb; --ink:#1c1c1a; --muted:#6f6d67; --faint:#aeaba3; --line:#e3e0d8;
  --chip:#ece9e2; --accent:#c4352b; --accent-ink:#fff; --warn:#a9640a; --ok:#2f7a4c; --cap:24px;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans SC","Helvetica Neue",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#111215; --panel:#18191c; --ink:#ebeae6; --muted:#9b9991; --faint:#5d5b56; --line:#26272b;
         --chip:#222327; --accent:#e2483c; --warn:#dc9c3b; --ok:#5cb784; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;font:15px/1.45 var(--sans);
  padding-top:env(safe-area-inset-top,0px)}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.brand{font-weight:650;letter-spacing:.02em}
.tabs{display:flex;background:var(--chip);border-radius:9px;padding:3px}
.tabs button{height:30px;background:transparent;color:var(--muted);padding:0 14px;border-radius:7px}
.tabs button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.spacer{flex:1}
.field{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:8px;padding:0 10px;height:38px;min-width:0}
.field label{color:var(--muted);font-size:12px;white-space:nowrap}
.field input{border:0;background:transparent;color:var(--ink);font:inherit;outline:none;min-width:0;width:100%}
#courseBox{flex:0 1 200px} #termsBox{flex:1 1 260px}
.check{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer;user-select:none}
button{font:inherit;border:0;border-radius:8px;height:38px;padding:0 14px;cursor:pointer;background:var(--chip);color:var(--ink)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon{width:38px;padding:0}
.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.pill{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.status[data-s=live] .pill{background:var(--accent);animation:pulse 1.6s infinite}
.status[data-s=watching] .pill{background:var(--ok);animation:pulse 1.6s infinite}
.status[data-s=connecting] .pill,.status[data-s=reconnecting] .pill,.status[data-s=stopping] .pill,.status[data-s=paused] .pill{background:var(--warn)}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){.pill{animation:none!important}}
#go{background:var(--accent);color:var(--accent-ink);font-weight:600;min-width:104px;display:flex;align-items:center;justify-content:center;gap:8px}
#go .dot{width:9px;height:9px;border-radius:50%;background:currentColor}
#go.rec .dot{border-radius:2px}
.sub{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;padding:6px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.sub code{font:12px var(--mono);color:var(--ink);word-break:break-all}
.warnText{color:var(--warn)}
#banner{display:none;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:var(--chip);border-left:3px solid var(--warn);font-size:14px}
#banner.on{display:flex}
#banner button{height:30px;padding:0 10px;font-size:13px;background:var(--panel)}
main{flex:1;overflow-y:auto;padding:20px 0 80px;-webkit-overflow-scrolling:touch}
#log{max-width:1000px;margin:0 auto;padding:0 20px;font-size:var(--cap);line-height:1.5}
.line{display:grid;grid-template-columns:64px minmax(0,1fr);gap:0 16px;padding:5px 0}
.line .t{font:12px/1 var(--mono);color:var(--faint);text-align:right;padding-top:calc(var(--cap)*.5)}
.line .tx{min-width:0;overflow-wrap:anywhere}
.line.note .tx{font-size:13px;color:var(--muted);font-style:italic;padding:6px 0}
.spk{display:inline-block;font-size:12px;font-weight:600;line-height:1;padding:4px 6px;border-radius:5px;margin-right:8px;vertical-align:.25em;background:var(--chip);color:var(--muted)}
#live .int{color:var(--muted)}
#live.idle{display:none}
.empty{max-width:520px;margin:10vh auto 0;text-align:center;color:var(--muted);font-size:15px;line-height:1.75;padding:0 20px}
.empty b{color:var(--ink);font-weight:600}
#jump{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:none;box-shadow:0 2px 10px rgba(0,0,0,.18);background:var(--panel)}
#jump.on{display:block}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:20px;width:min(460px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h3{margin:0 0 4px;font-size:16px}
dialog p{margin:0 0 14px;color:var(--muted);font-size:13px}
dialog .f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
dialog .f label{font-size:12px;color:var(--muted)}
dialog .f input{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:0 10px;font:13px var(--mono)}
dialog .rowEnd{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;flex-wrap:wrap}
dialog .primary{background:var(--accent);color:var(--accent-ink)}
#testOut{font-size:13px;min-height:1.4em;white-space:pre-line}
.recOnly{} .watchOnly{display:none}
body.watch .recOnly{display:none!important} body.watch .watchOnly{display:revert}
@media (max-width:640px){
  header{padding:10px 14px}
  #courseBox,#termsBox{flex:1 1 100%}
  .line{grid-template-columns:minmax(0,1fr)} .line .t{text-align:left;padding:0 0 2px}
  #log{padding:0 16px}
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--panel);border-top:1px solid var(--line);
        padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center}
  .dock .status{flex:1;min-width:0} #statusText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dock #go{flex:0 0 46%;height:48px;font-size:17px}
  .dock .icon{height:48px;width:44px}
  main{padding-bottom:110px}
  #jump{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (min-width:641px){ .dock{display:flex;gap:10px;align-items:center} .dock .status{margin-right:6px} }
</style>
</head>
<body>
<header>
  <div class="row">
    <span class="brand">课堂转写</span>
    <div class="tabs" role="group" aria-label="模式">
      <button id="tabRec" aria-pressed="true">录音</button>
      <button id="tabWatch" aria-pressed="false">观看</button>
    </div>
    <span class="spacer"></span>
    <div class="dock">
      <div class="status" id="status" data-s="idle"><span class="pill"></span><span id="statusText">未开始</span></div>
      <button class="icon" id="smaller" title="字号减小" aria-label="字号减小">A−</button>
      <button class="icon" id="bigger" title="字号增大" aria-label="字号增大">A+</button>
      <button id="go" class="recOnly"><span class="dot"></span><span id="goText">开始</span></button>
    </div>
    <button class="icon" id="gear" title="设置" aria-label="设置">⚙︎</button>
  </div>
  <div class="row recOnly">
    <div class="field" id="courseBox"><label for="course">课程</label><input id="course" list="courses" placeholder="填课程名，如 Sec Reg" autocomplete="off"></div>
    <datalist id="courses"></datalist>
    <div class="field" id="termsBox"><label for="terms">术语</label><input id="terms" placeholder="WKSI, EDGAR, Rule 144（逗号分隔）" autocomplete="off"></div>
    <label class="check"><input type="checkbox" id="diarize">区分讲话人</label>
  </div>
</header>
<div class="sub"><span>存到：<code id="file">—</code></span><span id="count"></span><span id="sync"></span></div>
<div id="banner"><span id="bannerText"></span><span class="spacer"></span><span id="bannerActions"></span></div>
<main id="main">
  <div id="log">
    <div class="empty" id="empty"></div>
    <div class="line idle" id="live"><span class="t" id="liveT"></span><span class="tx"><span id="liveFin"></span> <span class="int" id="liveInt"></span></span></div>
  </div>
</main>
<button id="jump">↓ 最新</button>

<dialog id="settings">
  <h3>设置</h3>
  <p>只存在这台设备的浏览器里。每台设备（手机、电脑）各填一次。</p>
  <div class="f"><label for="sKey">Deepgram API key</label><input id="sKey" type="password" autocomplete="off" spellcheck="false"></div>
  <div class="f"><label for="sUrl">存稿网址（Apps Script 网页应用，/exec 结尾）</label><input id="sUrl" type="url" autocomplete="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec"></div>
  <div class="f"><label for="sPass">口令</label><input id="sPass" type="password" autocomplete="off" spellcheck="false"></div>
  <div id="testOut"></div>
  <div class="rowEnd"><button id="sTest">测试连接</button><button id="sCancel">取消</button><button class="primary" id="sSave">保存</button></div>
</dialog>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var LS = {
  get: function(k, d){ try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del: function(k){ try { localStorage.removeItem(k); } catch (e) {} }
};
var SEED_TERMS = { "Sec Reg": "WKSI, EDGAR, Rule 144, Rule 163, Rule 163B, Rule 415, Securities Act, Exchange Act, free writing prospectus, gun jumping, Regulation D, seasoned issuer, indenture, Trust Indenture Act" };
var DG = "wss://api.deepgram.com/v1/listen";
var IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
var QS = new URLSearchParams(location.search);
var DEV = (function(){ var u = navigator.userAgent;
  if (/iPhone/.test(u)) return "iPhone"; if (/iPad/.test(u) || IOS) return "iPad";
  if (/Android/.test(u)) return /SM-|Samsung/i.test(u) ? "Samsung" : "Android";
  if (/Mac/.test(u)) return "Mac"; if (/Windows/.test(u)) return "Windows"; return "浏览器"; })();

var cfg = LS.get("cfg", { key: "", url: "", pass: "" });
if (QS.get("dg")) DG = QS.get("dg");          // 测试用
var mode = location.hash === "#watch" ? "watch" : "record";

/* ===================== 通用 UI ===================== */
var STATUS = { idle: "未开始", connecting: "连接中…", live: "录音中", reconnecting: "重连中…", stopping: "正在收尾…",
               paused: "麦克风中断", watching: "实时", ended: "已结束", waiting: "等待录音" };
var startedAt = 0, timerId = 0, stick = true;
function clock(){ return new Date().toTimeString().slice(0, 8); }
function pad(n){ return String(n).padStart(2, "0"); }
function setStatus(s){
  $("status").dataset.s = s;
  if (mode === "record") {
    var rec = s !== "idle";
    $("go").classList.toggle("rec", rec);
    $("goText").textContent = rec ? "结束" : "开始";
    $("go").disabled = s === "stopping";
    ["course", "terms", "diarize"].forEach(function(id){ $(id).disabled = rec; });
    $("tabWatch").disabled = rec;
  }
  renderStatus();
}
function renderStatus(){
  var s = $("status").dataset.s, txt = STATUS[s] || s;
  if (mode === "record" && startedAt && s !== "idle") {
    var sec = Math.floor((Date.now() - startedAt) / 1000), h = Math.floor(sec / 3600);
    txt += " · " + (h ? h + ":" + pad(Math.floor(sec % 3600 / 60)) : Math.floor(sec / 60)) + ":" + pad(sec % 60);
  }
  $("statusText").textContent = txt;
}
function banner(msg, actions){
  var b = $("banner"), a = $("bannerActions"); a.textContent = "";
  if (!msg) { b.classList.remove("on"); banner.kind = ""; return; }
  $("bannerText").textContent = msg;
  (actions || []).forEach(function(x){ var btn = document.createElement("button"); btn.textContent = x[0]; btn.onclick = x[1]; a.appendChild(btn); });
  b.classList.add("on");
}
function setFont(px){ px = Math.max(16, Math.min(44, px)); document.documentElement.style.setProperty("--cap", px + "px"); LS.set("capPx", px); }
function nearBottom(){ var m = $("main"); return m.scrollHeight - m.scrollTop - m.clientHeight < 80; }
function follow(){ if (stick) { var m = $("main"); m.scrollTop = m.scrollHeight; } }
function clearLog(){ Array.prototype.slice.call(document.querySelectorAll("#log .line:not(#live)")).forEach(function(n){ n.remove(); }); }
function addLine(t, spk, text, cls){
  $("empty").style.display = "none";
  var d = document.createElement("div"); d.className = "line" + (cls ? " " + cls : "");
  var ts = document.createElement("span"); ts.className = "t"; ts.textContent = t || "";
  var tx = document.createElement("span"); tx.className = "tx";
  if (spk != null) { var s = document.createElement("span"); s.className = "spk"; s.textContent = "S" + spk; tx.appendChild(s); }
  tx.appendChild(document.createTextNode(text));
  d.appendChild(ts); d.appendChild(tx);
  $("log").insertBefore(d, $("live"));
  follow();
}
function renderLine(raw){            // 稿子里的一行 → 页面
  var m = /^\[(\d\d:\d\d:\d\d)\]\s(?:S(\d+):\s)?(.*)$/.exec(raw);
  if (m) { addLine(m[1], m[2] == null ? null : m[2], m[3]); return; }
  m = /^_\[(\d\d:\d\d:\d\d)\]\s(.*)_$/.exec(raw);
  if (m) addLine("", null, m[1].slice(0, 5) + " " + m[2], "note");
}
function setEmpty(html){ $("empty").innerHTML = html; $("empty").style.display = ""; }

/* ===================== 云端存稿 ===================== */
function hasBackend(){ return !!(cfg.url && cfg.pass); }
function be(action, data, url, pass){
  var body = Object.assign({ action: action, pass: pass || cfg.pass }, data || {});
  return fetch(url || cfg.url, { method: "POST", body: JSON.stringify(body), redirect: "follow", cache: "no-store" })
    .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(j){ if (!j.ok) { var e = new Error(j.error || "失败"); e.data = j; throw e; } return j; });
}

/* ===================== 录音模式 ===================== */
var sid = 0, stream = null, ws = null, recorder = null, actx = null, pcmNode = null, srcNode = null, usePCM = false;
var stopping = false, backoff = 1000, failStreak = 0, hadDrop = false, dropAt = 0;
var keepAliveId = 0, watchdogId = 0, syncId = 0, wakeLock = null, lastAudioAt = 0, lastReacquire = 0, hiddenAt = 0;
var diarize = false, keyterms = [];
var parts = [], speakers = {}, lineStart = null;
var sess = LS.get("sess", null);           // {id,name,course,stamp,started,seq,ended}
var pending = LS.get("pending", []);       // [{seq,text}]
var syncing = false, lastSyncOk = 0;

function saveSess(){ LS.set("sess", sess); LS.set("pending", pending); }
function setCount(){ $("count").textContent = sess && sess.seq ? sess.seq + " 段" : ""; }
function renderSync(){
  var el = $("sync");
  if (mode !== "record") { el.textContent = ""; return; }
  if (!hasBackend()) { el.innerHTML = '<span class="warnText">未设置云端存稿，只显示字幕</span>'; return; }
  var waiting = pending.length + orphans.reduce(function(n, o){ return n + o.pending.length; }, 0);
  if (waiting) el.innerHTML = '<span class="warnText">' + waiting + " 段待上传</span>";
  else el.textContent = lastSyncOk ? "已同步" : "";
}
function queueLine(text){
  if (!sess) return;
  sess.seq = (sess.seq || 0) + 1;
  pending.push({ seq: sess.seq, text: text });
  saveSess(); setCount(); renderSync();
  if (Date.now() - lastSyncOk > 3000) sync();
}
var orphans = LS.get("orphans", []);      // 之前没传完的稿子：[{sess,pending}]
function sessDone(x){ return !x || (x.ended && x.stopSent); }
function pushBatch(x, list){            // 把 list 传到 x.id；返回剩余未确认的
  if (!list.length) return Promise.resolve(list);
  var batch = list.slice(0, 200);
  return be("append", { id: x.id, seq: batch[0].seq, lines: batch.map(function(y){ return y.text; }) })
    .then(function(r){ return list.filter(function(y){ return y.seq > r.seq; }); })
    .catch(function(e){
      if (e.data && typeof e.data.seq === "number") {   // 序号对不上：按服务器记录的位置重新编号
        var base = e.data.seq; list.forEach(function(y, i){ y.seq = base + 1 + i; }); x.seq = base + list.length;
      }
      throw e;
    });
}
function ensureId(x){
  if (x.id) return Promise.resolve();
  return be("start", { course: x.course, stamp: x.stamp, started: x.started, device: DEV, clock: clock() })
    .then(function(r){ x.id = r.id; x.name = r.name; });
}
function syncOrphans(){
  if (!orphans.length) return Promise.resolve();
  var o = orphans[0];
  return ensureId(o.sess).then(function(){ return pushBatch(o.sess, o.pending); }).then(function(rest){
    o.pending = rest; LS.set("orphans", orphans);
    if (rest.length) return;
    return be("stop", { id: o.sess.id, clock: clock(), ended: o.sess.endedText || "" }).catch(function(){}).then(function(){
      orphans.shift(); LS.set("orphans", orphans);
    });
  }, function(e){ LS.set("orphans", orphans); throw e; });
}
function sync(){
  if (syncing || !hasBackend()) return Promise.resolve();
  syncing = true;
  var cur = sessDone(sess) ? Promise.resolve() : ensureId(sess).then(function(){
    $("file").textContent = sess.name; saveSess();
    return pushBatch(sess, pending);
  }).then(function(rest){
    if (rest) { pending = rest; saveSess(); }
    // 已结束、全部传完：补发结束标记
    if (sess && sess.ended && !pending.length && sess.id && !sess.stopSent) {
      sess.stopSent = true; saveSess();
      return be("stop", { id: sess.id, clock: clock(), ended: sess.endedText || "" }).catch(function(){});
    }
  }, function(e){ saveSess(); throw e; });
  return cur.then(syncOrphans).then(function(){
    lastSyncOk = Date.now(); syncing = false; renderSync();
    if (banner.kind === "sync") banner("");
    if (sessDone(sess) && !orphans.length && !stream) clearInterval(syncId);
  }).catch(function(e){
    syncing = false; renderSync();
    if (!banner.kind || banner.kind === "sync") {
      banner("云端存稿暂时连不上（" + e.message + "）。字幕照常，内容先存在这台设备上，连上后自动补传。");
      banner.kind = "sync";
    }
  });
}

function flushLine(){
  if (!parts.length) return;
  var spk = null, best = -1;
  if (diarize) for (var k in speakers) if (speakers[k] > best) { best = speakers[k]; spk = k; }
  var text = parts.join(" "), t = lineStart;
  parts = []; speakers = {}; lineStart = null;
  addLine(t, spk, text);
  queueLine("[" + t + "] " + (spk != null ? "S" + spk + ": " : "") + text);
  renderLive("");
}
function note(msg){ flushLine(); addLine("", null, clock().slice(0, 5) + " " + msg, "note"); queueLine("\n_[" + clock() + "] " + msg + "_\n\n"); }
function renderLive(interim){
  var live = $("live"), fin = parts.join(" ");
  if (!fin && !interim) { live.classList.add("idle"); return; }
  $("empty").style.display = "none"; live.classList.remove("idle");
  $("liveT").textContent = lineStart || clock();
  $("liveFin").textContent = fin; $("liveInt").textContent = interim || "";
  follow();
}
function onMessage(ev){
  var d; try { d = JSON.parse(ev.data); } catch (e) { return; }
  if (d.type === "UtteranceEnd") { flushLine(); return; }
  if (d.type !== "Results") return;
  var alt = ((d.channel && d.channel.alternatives) || [])[0]; if (!alt) return;
  var text = (alt.transcript || "").trim();
  if (!d.is_final) { renderLive(text); return; }
  if (text) {
    if (!lineStart) lineStart = clock();
    parts.push(text);
    if (diarize) (alt.words || []).forEach(function(w){ if (w.speaker != null) speakers[w.speaker] = (speakers[w.speaker] || 0) + 1; });
  }
  if (d.speech_final || parts.join(" ").length > 700) flushLine(); else renderLive("");
}

/* ----- 音频：Chrome/安卓用 Opus（省流量），iPhone/Safari 用 16k PCM ----- */
var WORKLET = "class P extends AudioWorkletProcessor{constructor(){super();this.r=sampleRate/16000;this.p=0;this.s=0;this.c=0;this.b=new Int16Array(1600);this.n=0}" +
  "process(i){var x=i[0]&&i[0][0];if(!x)return true;for(var k=0;k<x.length;k++){this.s+=x[k];this.c++;this.p+=1;if(this.p>=this.r){this.p-=this.r;var v=this.s/this.c;this.s=0;this.c=0;v=v<-1?-1:v>1?1:v;" +
  "this.b[this.n++]=v<0?v*32768:v*32767;if(this.n===this.b.length){this.port.postMessage(this.b.buffer,[this.b.buffer]);this.b=new Int16Array(1600);this.n=0}}}return true}}registerProcessor('pcm16',P);";
function pickMime(){
  if (QS.has("pcm") || !window.MediaRecorder) return "";
  return MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "";
}
function sendAudio(buf){
  lastAudioAt = Date.now();
  if (ws && ws.readyState === 1) ws.send(buf);
}
function buildPCM(){
  if (!actx) return Promise.reject(new Error("音频引擎没启动"));
  if (srcNode) { try { srcNode.disconnect(); } catch (e) {} }
  srcNode = actx.createMediaStreamSource(stream);
  if (pcmNode) { srcNode.connect(pcmNode); return Promise.resolve(); }
  var mute = actx.createGain(); mute.gain.value = 0; mute.connect(actx.destination);
  var viaWorklet = actx.audioWorklet
    ? actx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "application/javascript" }))).then(function(){
        pcmNode = new AudioWorkletNode(actx, "pcm16");
        pcmNode.port.onmessage = function(e){ sendAudio(e.data); };
      })
    : Promise.reject(new Error("no worklet"));
  return viaWorklet.catch(function(){        // 旧 Safari 兜底
    var ratio = actx.sampleRate / 16000;
    pcmNode = actx.createScriptProcessor(4096, 1, 1);
    pcmNode.onaudioprocess = function(e){
      var x = e.inputBuffer.getChannelData(0), out = new Int16Array(Math.floor(x.length / ratio));
      for (var i = 0; i < out.length; i++) { var v = x[Math.floor(i * ratio)]; v = v < -1 ? -1 : v > 1 ? 1 : v; out[i] = v < 0 ? v * 32768 : v * 32767; }
      sendAudio(out.buffer);
    };
  }).then(function(){ srcNode.connect(pcmNode); pcmNode.connect(mute); });
}
function getMic(){
  return navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } })
    .then(function(s){
      stream = s;
      var tr = s.getAudioTracks()[0];
      if (tr) tr.onended = function(){ if (stream === s && !stopping) reacquire("麦克风断开"); };
      return usePCM ? buildPCM() : null;
    });
}
function reacquire(why){
  if (!stream || stopping || Date.now() - lastReacquire < 8000) return;
  if (document.visibilityState !== "visible") return;      // 回到前台再处理
  lastReacquire = Date.now();
  var my = sid;
  note(why + "，重新获取麦克风");
  try { stream.getTracks().forEach(function(t){ t.stop(); }); } catch (e) {}
  getMic().then(function(){
    if (my !== sid) return;
    if (!usePCM && ws) ws.close();      // Opus 需要新的录音器和新连接
    if (actx && actx.state !== "running") actx.resume().catch(function(){});
  }).catch(function(){ banner("拿不到麦克风了：检查是否被别的 App 占用，然后点结束再点开始。"); });
}

/* ----- Deepgram 连接 ----- */
function dgUrl(){
  var q = [["model", "nova-3"], ["language", "en"], ["smart_format", "true"], ["punctuate", "true"],
           ["interim_results", "true"], ["endpointing", "400"], ["utterance_end_ms", "1500"]];
  if (usePCM) q.push(["encoding", "linear16"], ["sample_rate", "16000"], ["channels", "1"]);
  if (diarize) q.push(["diarize", "true"]);
  keyterms.forEach(function(k){ q.push(["keyterm", k]); });
  return DG + "?" + q.map(function(p){ return p[0] + "=" + encodeURIComponent(p[1]); }).join("&");
}
function connect(my){
  if (my !== sid || stopping || !stream) return;
  setStatus(hadDrop ? "reconnecting" : "connecting");
  var opened = false, sock;
  try { sock = new WebSocket(dgUrl(), ["token", cfg.key]); } catch (e) { banner("连接地址有问题：" + e.message); return; }
  sock.binaryType = "arraybuffer";
  ws = sock;
  sock.onopen = function(){
    if (my !== sid) { sock.close(); return; }
    opened = true; failStreak = 0; backoff = 1000;
    if (hadDrop) { note("已重新连接（断线约 " + Math.round((Date.now() - dropAt) / 1000) + " 秒，这段音频未转写）"); hadDrop = false; }
    if (banner.kind === "dg") banner("");
    if (!usePCM) {
      recorder = new MediaRecorder(stream, { mimeType: "audio/webm;codecs=opus" });
      recorder.ondataavailable = function(e){ if (e.data && e.data.size) sendAudio(e.data); };
      recorder.start(250);
    }
    clearInterval(keepAliveId);
    keepAliveId = setInterval(function(){ if (sock.readyState === 1) sock.send(JSON.stringify({ type: "KeepAlive" })); }, 8000);
    lastAudioAt = Date.now();
    setStatus("live");
  };
  sock.onmessage = onMessage;
  sock.onclose = function(){
    clearInterval(keepAliveId);
    if (recorder && recorder.state !== "inactive") { try { recorder.stop(); } catch (e) {} }
    recorder = null;
    if (ws === sock) ws = null;
    if (my !== sid) return;
    if (stopping) { finishStop(); return; }
    flushLine();
    if (opened) { hadDrop = true; dropAt = Date.now(); note("连接中断，重连中"); }
    else if (++failStreak >= 2) {
      banner("连不上 Deepgram：检查 key 是否正确、账户余额、网络。仍在自动重试…", [["打开设置", openSettings]]);
      banner.kind = "dg";
    }
    setStatus("reconnecting");
    setTimeout(function(){ connect(my); }, backoff);
    backoff = Math.min(backoff * 2, 30000);
  };
}

/* ----- 开始 / 结束 ----- */
function parseTerms(s){ return s.split(/[,，\n]/).map(function(x){ return x.trim(); }).filter(Boolean).slice(0, 100); }
function fillCourses(){
  var dl = $("courses"); dl.textContent = "";
  var list = LS.get("courses", []);
  Object.keys(SEED_TERMS).forEach(function(c){ if (list.indexOf(c) < 0) list.push(c); });
  list.forEach(function(c){ var o = document.createElement("option"); o.value = c; dl.appendChild(o); });
}
function loadCoursePrefs(){
  var c = $("course").value.trim(), tm = LS.get("terms", {}), dm = LS.get("diarize", {});
  if (tm[c] != null) $("terms").value = tm[c]; else if (SEED_TERMS[c]) $("terms").value = SEED_TERMS[c];
  if (dm[c] != null) $("diarize").checked = !!dm[c];
}
function rememberCourse(c){
  var list = LS.get("courses", []).filter(function(x){ return x !== c; }); list.unshift(c); LS.set("courses", list.slice(0, 12));
  var tm = LS.get("terms", {}); tm[c] = $("terms").value; LS.set("terms", tm);
  var dm = LS.get("diarize", {}); dm[c] = diarize; LS.set("diarize", dm);
  fillCourses();
}
function requestWake(){
  if (!("wakeLock" in navigator) || wakeLock) return;
  navigator.wakeLock.request("screen").then(function(l){ wakeLock = l; l.addEventListener("release", function(){ wakeLock = null; }); }).catch(function(){});
}
function stamps(){
  var d = new Date();
  return { stamp: d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "_" + pad(d.getHours()) + pad(d.getMinutes()),
           started: d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) };
}
function start(){
  var course = $("course").value.trim();
  if (!course) { $("course").focus(); banner("先填课程名，转写稿会按课程命名。"); return; }
  if (!cfg.key) { openSettings(); return; }
  diarize = $("diarize").checked; keyterms = parseTerms($("terms").value);
  rememberCourse(course);
  usePCM = !pickMime();
  // iPhone 要求在点击当下创建音频引擎
  if (usePCM && !actx) { var AC = window.AudioContext || window.webkitAudioContext; actx = new AC(); }
  if (actx && actx.state !== "running") actx.resume().catch(function(){});
  var my = ++sid;
  stopping = false; backoff = 1000; failStreak = 0; hadDrop = false; parts = []; speakers = {}; lineStart = null;
  setStatus("connecting"); banner("");
  getMic().then(function(){
    if (my !== sid) { stream.getTracks().forEach(function(t){ t.stop(); }); return; }
    var resume = sess && !sess.ended && sess.course === course;
    if (resume) {
      if (sess.id && hasBackend()) {
        be("start", { resumeId: sess.id, course: course, clock: clock(), device: DEV }).then(function(r){ if (r.resumed) lastSyncOk = Date.now(); }).catch(function(){});
      }
      note("继续录制");
    } else {
      if (sess && pending.length) { sess.ended = true; orphans.push({ sess: sess, pending: pending }); LS.set("orphans", orphans); }
      var st = stamps();
      sess = { id: null, name: null, course: course, stamp: st.stamp, started: st.started, seq: 0, ended: false };
      pending = []; saveSess(); clearLog();
      $("file").textContent = hasBackend() ? "（正在创建…）" : "—";
    }
    $("file").textContent = sess.name || $("file").textContent;
    setCount(); renderSync();
    startedAt = Date.now(); clearInterval(timerId); timerId = setInterval(renderStatus, 1000);
    clearInterval(syncId); syncId = setInterval(sync, 4000); sync();
    clearInterval(watchdogId); watchdogId = setInterval(watchdog, 5000);
    stick = true; requestWake();
    connect(my);
  }).catch(function(e){
    if (stream) { stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
    setStatus("idle");
    if (e && (e.name === "NotAllowedError" || e.name === "SecurityError"))
      banner(IOS ? "没有麦克风权限：设置 → Safari → 麦克风，选允许，再回来点开始。" : "没有麦克风权限：点地址栏左侧的图标，允许使用麦克风，再点开始。");
    else if (e && e.name === "NotFoundError") banner("没找到麦克风。");
    else banner("启动失败：" + (e && e.message || e));
  });
}
function watchdog(){
  if (!stream || stopping || $("status").dataset.s !== "live") return;
  if (document.visibilityState === "visible" && Date.now() - lastAudioAt > 15000) reacquire("15 秒没收到声音");
}
function stop(){
  if (stopping) return;
  stopping = true; setStatus("stopping");
  var sock = ws, rec = recorder;
  if (sock && sock.readyState === 1) {
    var close = function(){ try { sock.send(JSON.stringify({ type: "CloseStream" })); } catch (e) {} };
    if (rec && rec.state !== "inactive") { rec.onstop = close; rec.stop(); } else close();
    setTimeout(function(){ if (sock.readyState < 2) sock.close(); }, 6000);
  } else if (sock && sock.readyState < 2) sock.close();
  else finishStop();
}
function finishStop(){
  if (!stopping) return;
  flushLine(); renderLive("");
  if (stream) { stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
  if (srcNode) { try { srcNode.disconnect(); } catch (e) {} srcNode = null; }
  if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  clearInterval(timerId); clearInterval(watchdogId);
  sid++;
  var done = function(){ stopping = false; startedAt = 0; setStatus("idle"); renderSync(); };
  if (sess) { sess.ended = true; sess.endedText = stamps().started; saveSess(); }
  if (!hasBackend() || !sess) { clearInterval(syncId); done(); return; }
  sync().then(done);
}

/* ===================== 观看模式 ===================== */
var wid = null, wsince = 0, wtimer = 0, wbusy = false, wlive = false, wfails = 0;
function poll(){
  clearTimeout(wtimer);
  if (mode !== "watch") return;
  if (!hasBackend()) { setEmpty("观看模式需要先在 <b>设置</b> 里填存稿网址和口令。"); setStatus("idle"); return; }
  if (document.visibilityState !== "visible") { wtimer = setTimeout(poll, 3000); return; }
  if (wbusy) return;
  wbusy = true;
  be("latest", { id: wid, since: wsince }).then(function(r){
    wbusy = false; wfails = 0; if (banner.kind === "watch") banner("");
    if (r.none) { setEmpty("还没有任何录音。在手机或电脑上切到 <b>录音</b> 点开始，这里会自动出现。"); setStatus("waiting"); wtimer = setTimeout(poll, 10000); return; }
    if (r.id !== wid) { clearLog(); wid = r.id; stick = true; }
    $("file").textContent = r.name;
    r.lines.forEach(renderLine);
    wsince = r.since + r.lines.length;
    wlive = r.live;
    setStatus(r.live ? "watching" : "ended");
    if (!document.querySelector("#log .line:not(#live)")) setEmpty(r.live ? "已连上「" + r.course + "」，等第一句话…" : "「" + r.course + "」已结束，没有内容。");
    wtimer = setTimeout(poll, r.live ? 2500 : 15000);
  }).catch(function(e){
    wbusy = false; wfails++;
    if (wfails >= 2) { banner("连不上存稿服务：" + e.message, [["打开设置", openSettings]]); banner.kind = "watch"; }
    wtimer = setTimeout(poll, Math.min(30000, 3000 * wfails));
  });
}

/* ===================== 模式切换 / 设置 ===================== */
function setMode(m){
  if (mode === "record" && $("status").dataset.s !== "idle" && m === "watch") return;
  mode = m;
  document.body.classList.toggle("watch", m === "watch");
  $("tabRec").setAttribute("aria-pressed", m === "record"); $("tabWatch").setAttribute("aria-pressed", m === "watch");
  history.replaceState(null, "", m === "watch" ? "#watch" : location.pathname + location.search);
  clearLog(); renderLive(""); clearTimeout(wtimer);
  if (m === "watch") {
    wid = null; wsince = 0; $("file").textContent = "—"; $("count").textContent = "";
    setEmpty("正在连接…"); setStatus("idle"); renderSync(); poll();
  } else {
    $("file").textContent = sess && !sess.ended && sess.name ? sess.name : "—";
    setEmpty("填好课程，点 <b>开始</b>。字幕实时出现在这里，定稿自动存进 Google Drive 的 <code>ClassTranscripts</code>，<br>别的设备切到 <b>观看</b> 就能同步看到。");
    if (sess && !sess.ended) {
      $("course").value = sess.course; loadCoursePrefs();
      banner("「" + sess.course + "」还没结束。点开始会接着写进同一份稿子。");
    }
    setStatus("idle"); setCount(); renderSync();
  }
}
function openSettings(){
  $("sKey").value = cfg.key || ""; $("sUrl").value = cfg.url || ""; $("sPass").value = cfg.pass || ""; $("testOut").textContent = "";
  $("settings").showModal();
}
function testSettings(){
  var key = $("sKey").value.trim(), url = $("sUrl").value.trim(), pass = $("sPass").value.trim(), out = $("testOut");
  out.textContent = "测试中…";
  var res = [];
  var t1 = url ? be("ping", {}, url, pass).then(function(r){ res.push("✓ 存稿服务可用（Drive 文件夹：" + r.folder + "）"); })
                 .catch(function(e){ res.push("✗ 存稿服务：" + e.message); }) : Promise.resolve(res.push("· 没填存稿网址：只能看字幕，不存稿"));
  var t2 = new Promise(function(done){
    if (!key) { res.push("✗ 没填 Deepgram key"); return done(); }
    var s, timer = setTimeout(function(){ res.push("✗ Deepgram：连接超时"); try { s.close(); } catch (e) {} done(); }, 8000);
    try { s = new WebSocket(DG + "?model=nova-3&encoding=linear16&sample_rate=16000", ["token", key]); }
    catch (e) { clearTimeout(timer); res.push("✗ Deepgram：" + e.message); return done(); }
    s.onopen = function(){ clearTimeout(timer); res.push("✓ Deepgram key 可用"); try { s.send(JSON.stringify({ type: "CloseStream" })); s.close(); } catch (e) {} done(); };
    s.onerror = function(){ clearTimeout(timer); res.push("✗ Deepgram：连接被拒，key 可能不对"); done(); };
  });
  Promise.all([t1, t2]).then(function(){ out.textContent = res.join("\n"); });
}

/* ===================== 事件 ===================== */
$("go").onclick = function(){ if ($("status").dataset.s === "idle") start(); else stop(); };
$("tabRec").onclick = function(){ setMode("record"); };
$("tabWatch").onclick = function(){ setMode("watch"); };
$("gear").onclick = openSettings;
$("sCancel").onclick = function(){ $("settings").close(); };
$("sTest").onclick = testSettings;
$("sSave").onclick = function(){
  cfg = { key: $("sKey").value.trim(), url: $("sUrl").value.trim(), pass: $("sPass").value.trim() };
  LS.set("cfg", cfg); $("settings").close(); banner(""); renderSync();
  if (mode === "watch") { wid = null; wsince = 0; clearLog(); poll(); } else if (sess && pending.length) sync();
};
$("course").addEventListener("change", loadCoursePrefs);
$("course").addEventListener("input", function(){ var c = $("course").value.trim(); if (LS.get("courses", []).indexOf(c) >= 0 || SEED_TERMS[c]) loadCoursePrefs(); });
$("smaller").onclick = function(){ setFont(LS.get("capPx", 24) - 2); };
$("bigger").onclick = function(){ setFont(LS.get("capPx", 24) + 2); };
$("main").addEventListener("scroll", function(){ stick = nearBottom(); $("jump").classList.toggle("on", !stick); });
$("jump").onclick = function(){ stick = true; follow(); $("jump").classList.remove("on"); };
document.addEventListener("visibilitychange", function(){
  if (document.visibilityState === "hidden") { hiddenAt = Date.now(); return; }
  if (mode === "watch") { poll(); return; }
  if (!stream) return;
  requestWake();
  if (actx && actx.state !== "running") actx.resume().catch(function(){});
  var away = hiddenAt ? Math.round((Date.now() - hiddenAt) / 1000) : 0; hiddenAt = 0;
  if (IOS && away >= 5) note("页面在后台约 " + away + " 秒（iPhone 上这段可能没录到）");
  var tr = stream.getAudioTracks()[0];
  if (!tr || tr.readyState === "ended" || tr.muted) { lastReacquire = 0; reacquire("麦克风被系统中断"); }
});
window.addEventListener("beforeunload", function(e){ if (stream) { e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("online", function(){ if (mode === "record" && sess) sync(); if (mode === "watch") poll(); });

/* ===================== 初始化 ===================== */
setFont(LS.get("capPx", IOS || DEV === "Samsung" || DEV === "Android" ? 20 : 24));
fillCourses();
$("course").value = (sess && !sess.ended && sess.course) || LS.get("courses", [])[0] || "";
loadCoursePrefs();
setMode(mode);
if (!cfg.key && mode === "record") openSettings();
if (hasBackend() && ((sess && !sessDone(sess)) || orphans.length)) { sync(); syncId = setInterval(sync, 8000); }
})();
</script>
</body>
</html>
