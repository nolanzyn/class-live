<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>课堂转写</title>
<style>
/* 布局：顶栏（模式 + 课程设置）＋ 大字字幕流；手机上开始/结束按钮固定在底部，方便单手按 */
:root{
  --bg:#f5f4f0; --panel:#fffefb; --ink:#1c1c1a; --muted:#6f6d67; --faint:#aeaba3; --line:#e3e0d8;
  --chip:#ece9e2; --accent:#c4352b; --accent-ink:#fff; --warn:#a9640a; --ok:#2f7a4c; --cap:24px;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans SC","Helvetica Neue",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#111215; --panel:#18191c; --ink:#ebeae6; --muted:#9b9991; --faint:#5d5b56; --line:#26272b;
         --chip:#222327; --accent:#e2483c; --warn:#dc9c3b; --ok:#5cb784; color-scheme:dark; }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;font:15px/1.45 var(--sans);
  padding-top:env(safe-area-inset-top,0px)}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.brand{font-weight:650;letter-spacing:.02em}
.tabs{display:flex;background:var(--chip);border-radius:9px;padding:3px}
.tabs button{height:30px;background:transparent;color:var(--muted);padding:0 14px;border-radius:7px}
.tabs button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.spacer{flex:1}
.field{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:8px;padding:0 10px;height:38px;min-width:0}
.field label{color:var(--muted);font-size:12px;white-space:nowrap}
.field input{border:0;background:transparent;color:var(--ink);font:inherit;outline:none;min-width:0;width:100%}
#courseBox{flex:0 1 200px} #termsBox{flex:1 1 260px}
.check{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer;user-select:none}
button{font:inherit;border:0;border-radius:8px;height:38px;padding:0 14px;cursor:pointer;background:var(--chip);color:var(--ink)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon{width:38px;padding:0}
.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.pill{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.status[data-s=live] .pill{background:var(--accent);animation:pulse 1.6s infinite}
.status[data-s=watching] .pill{background:var(--ok);animation:pulse 1.6s infinite}
.status[data-s=connecting] .pill,.status[data-s=reconnecting] .pill,.status[data-s=stopping] .pill,.status[data-s=paused] .pill{background:var(--warn)}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){.pill{animation:none!important}}
#go{background:var(--accent);color:var(--accent-ink);font-weight:600;min-width:104px;display:flex;align-items:center;justify-content:center;gap:8px}
#go .dot{width:9px;height:9px;border-radius:50%;background:currentColor}
#go.rec .dot{border-radius:2px}
.sub{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;padding:6px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.sub code{font:12px var(--mono);color:var(--ink);word-break:break-all}
.warnText{color:var(--warn)}
#banner{display:none;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:var(--chip);border-left:3px solid var(--warn);font-size:14px}
#banner.on{display:flex}
#banner button{height:30px;padding:0 10px;font-size:13px;background:var(--panel)}
main{flex:1;overflow-y:auto;padding:20px 0 80px;-webkit-overflow-scrolling:touch}
#log{max-width:1000px;margin:0 auto;padding:0 20px;font-size:var(--cap);line-height:1.5}
.line{display:grid;grid-template-columns:64px minmax(0,1fr);gap:0 16px;padding:5px 0}
.line .t{font:12px/1 var(--mono);color:var(--faint);text-align:right;padding-top:calc(var(--cap)*.5)}
.line .tx{min-width:0;overflow-wrap:anywhere}
.line.note .tx{font-size:13px;color:var(--muted);font-style:italic;padding:6px 0}
.spk{display:inline-block;font-size:12px;font-weight:600;line-height:1;padding:4px 6px;border-radius:5px;margin-right:8px;vertical-align:.25em;background:var(--chip);color:var(--muted)}
#live .int{color:var(--muted)}
.spk[data-k]{cursor:pointer} .spk.prof{color:var(--accent)} #liveSpk:empty{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:30px;padding:0 12px;font-size:13px;border-radius:15px;background:var(--chip);color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg)} .chip.armed{background:var(--accent);color:var(--accent-ink)}
#live.idle{display:none}
.empty{max-width:520px;margin:10vh auto 0;text-align:center;color:var(--muted);font-size:15px;line-height:1.75;padding:0 20px}
.empty b{color:var(--ink);font-weight:600}
#blackout{position:fixed;inset:0;z-index:50;background:#000;color:#3a3a3a;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;padding:24px;text-align:center;touch-action:manipulation;user-select:none}
#blackout[hidden]{display:none}
.bo-in{display:flex;align-items:center;gap:8px;font:14px var(--sans);font-variant-numeric:tabular-nums}
.bo-dot{width:7px;height:7px;border-radius:50%;background:#5a1a16}
#boLast{max-width:520px;font-size:15px;line-height:1.5;color:#333;max-height:40vh;overflow:hidden}
.bo-hint{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));font-size:12px;color:#2a2a2a}
#jump{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:none;box-shadow:0 2px 10px rgba(0,0,0,.18);background:var(--panel)}
#jump.on{display:block}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:20px;width:min(460px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h3{margin:0 0 4px;font-size:16px}
dialog p{margin:0 0 14px;color:var(--muted);font-size:13px}
dialog .f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
dialog .f label{font-size:12px;color:var(--muted)}
dialog .f input{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:0 10px;font:13px var(--mono)}
dialog .rowEnd{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;flex-wrap:wrap}
dialog .primary{background:var(--accent);color:var(--accent-ink)}
#qrImg{display:flex;justify-content:center;background:#fff;border-radius:8px;padding:8px;margin:4px 0 8px}
#qrImg svg{width:min(260px,70vw);height:auto}
.qrWarn{font-size:12px!important;margin:0 0 8px!important}
#testOut{font-size:13px;min-height:1.4em;white-space:pre-line}
.recOnly{} .watchOnly{display:none}
body.watch .recOnly{display:none!important} body.watch .watchOnly{display:revert}
@media (max-width:640px){
  header{padding:10px 14px}
  #courseBox,#termsBox{flex:1 1 100%}
  .line{grid-template-columns:minmax(0,1fr)} .line .t{text-align:left;padding:0 0 2px}
  #log{padding:0 16px}
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--panel);border-top:1px solid var(--line);
        padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center}
  .dock .status{flex:1;min-width:0} #statusText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dock #go{flex:0 0 40%;height:48px;font-size:17px}
  .dock #dark{height:48px;padding:0 12px}
  body.rec #termsBox, body.rec .check, body.rec #smaller, body.rec #bigger{display:none!important}
  .dock .icon{height:48px;width:44px}
  main{padding-bottom:110px}
  #jump{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (min-width:641px){ .dock{display:flex;gap:10px;align-items:center} .dock .status{margin-right:6px} }
</style>
</head>
<body>
<header>
  <div class="row">
    <span class="brand">课堂转写</span>
    <div class="tabs" role="group" aria-label="模式">
      <button id="tabRec" aria-pressed="true">录音</button>
      <button id="tabWatch" aria-pressed="false">观看</button>
    </div>
    <span class="spacer"></span>
    <div class="dock">
      <div class="status" id="status" data-s="idle"><span class="pill"></span><span id="statusText">未开始</span></div>
      <button class="icon" id="smaller" title="字号减小" aria-label="字号减小">A−</button>
      <button class="icon" id="bigger" title="字号增大" aria-label="字号增大">A+</button>
      <button class="recOnly" id="dark" title="息屏模式：屏幕全黑省电，录音照常" hidden>息屏</button>
      <button id="go" class="recOnly"><span class="dot"></span><span id="goText">开始</span></button>
    </div>
    <button class="icon" id="gear" title="设置" aria-label="设置">⚙︎</button>
  </div>
  <div class="row recOnly">
    <div class="field" id="courseBox"><label for="course">课程</label><input id="course" list="courses" placeholder="填课程名，如 Sec Reg" autocomplete="off"></div>
    <datalist id="courses"></datalist>
    <div class="field" id="termsBox"><label for="terms">术语</label><input id="terms" placeholder="WKSI, EDGAR, Rule 144（逗号分隔）" autocomplete="off"></div>
    <label class="check"><input type="checkbox" id="diarize" checked>区分讲话人</label>
  </div>
  <div class="chips recOnly" id="chips"></div>
</header>
<div class="sub"><span>存到：<code id="file">—</code></span><span id="count"></span><span id="sync"></span></div>
<div id="banner"><span id="bannerText"></span><span class="spacer"></span><span id="bannerActions"></span></div>
<main id="main">
  <div id="log">
    <div class="empty" id="empty"></div>
    <div class="line idle" id="live"><span class="t" id="liveT"></span><span class="tx"><span class="spk" id="liveSpk"></span><span id="liveFin"></span> <span class="int" id="liveInt"></span></span></div>
  </div>
</main>
<button id="jump">↓ 最新</button>

<div id="blackout" hidden>
  <div class="bo-in"><span class="bo-dot"></span><span id="boStatus">录音中</span></div>
  <div id="boLast"></div>
  <div class="bo-hint">息屏模式 · 录音照常进行 · 双击屏幕退出</div>
</div>
<dialog id="settings">
  <h3>设置</h3>
  <p>只存在这台设备的浏览器里。每台设备（手机、电脑）各填一次。</p>
  <div class="f"><label for="sKey">Deepgram API key</label><input id="sKey" type="password" autocomplete="off" spellcheck="false"></div>
  <div class="f"><label for="sUrl">存稿网址（Apps Script 网页应用，/exec 结尾）</label><input id="sUrl" type="url" autocomplete="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec"></div>
  <div class="f"><label for="sPass">口令</label><input id="sPass" type="password" autocomplete="off" spellcheck="false"></div>
  <div id="testOut"></div>
  <div id="qrBox" hidden>
    <div id="qrImg"></div>
    <p class="qrWarn">用另一台手机的相机扫这个码，打开后设置会自动填好。码里有你的 key 和口令，别让别人拍到。</p>
    <div class="f"><label for="qrLink">或者把这个链接发到手机上打开</label><input id="qrLink" readonly></div>
  </div>
  <div class="rowEnd"><button id="sQR">手机扫码设置</button><button id="sTest">测试连接</button><button id="sCancel">取消</button><button class="primary" id="sSave">保存</button></div>
</dialog>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {

function dgUrl(){
  var q = [["model", "nova-3"], ["language", "en"], ["smart_format", "true"], ["punctuate", "true"],

  ws = sock;
  sock.onopen = function(){
    if (my !== sid) { sock.close(); return; }
    opened = true; failStreak = 0; backoff = 1000;
    if (diarize) spkEpoch();
    if (hadDrop) { note("已重新连接（断线约 " + Math.round((Date.now() - dropAt) / 1000) + " 秒，这段音频未转写）"); hadDrop = false; }
    if (banner.kind === "dg") banner("");
    if (!usePCM) {

    lastAudioAt = Date.now();

    clearInterval(keepAliveId);
    if (recorder && recorder.state !== "inactive") { try { recorder.stop(); } catch (e) {} }
    recorder = null;
    if (ws === sock) ws = null;
    if (my !== sid) return;
    if (stopping) { finishStop(); return; }
    flushLine();
    if (opened) { hadDrop = true; dropAt = Date.now(); note("连接中断，重连中"); }
    else if (++failStreak >= 2) {
      banner("连不上 Deepgram：检查 key 是否正确、账户余额、网络。仍在自动重试…", [["打开设置", openSettings]]);
      banner.kind = "dg";

  if (!tr || tr.readyState === "ended" || tr.muted) { lastReacquire = 0; reacquire("麦克风被系统中断"); }
});
window.addEventListener("beforeunload", function(e){ if (stream) { e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("online", function(){ if (mode === "record" && sess) sync(); if (mode === "watch") poll(); });

/* ===================== 初始化 ===================== */
setFont(LS.get("capPx", IOS || DEV === "Samsung" || DEV === "Android" ? 20 : 24));
fillCourses();
$("course").value = (sess && !sess.ended && sess.course) || LS.get("courses", [])[0] || "";
loadCoursePrefs();
setMode(mode);
if (IMPORTED) banner("已从电脑导入设置：Deepgram 和存稿服务都配好了。可以直接点开始。");
else if (!cfg.key && mode === "record") openSettings();
loadCal();
if (hasBackend() && ((sess && !sessDone(sess)) || orphans.length)) { sync(); syncId = setInterval(sync, 8000); }
})();
</script>
