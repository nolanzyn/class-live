<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>面试助手</title>
<style>
/* 面试版：答案在上方正中（靠近摄像头），转写在下面；可以把答案放进总在最上层的悬浮窗 */
:root{
  --bg:#f5f4f0; --panel:#fffefb; --ink:#1c1c1a; --muted:#6f6d67; --faint:#aeaba3; --line:#e3e0d8;
  --chip:#ece9e2; --accent:#c4352b; --accent-ink:#fff; --warn:#a9640a; --ok:#2f7a4c; --cap:16px; --pf:24px;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans SC","Helvetica Neue",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#111215; --panel:#18191c; --ink:#ebeae6; --muted:#9b9991; --faint:#5d5b56; --line:#26272b;
         --chip:#222327; --accent:#e2483c; --warn:#dc9c3b; --ok:#5cb784; color-scheme:dark; }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;font:15px/1.45 var(--sans)}
header.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:650;letter-spacing:.02em;margin-right:2px}
.back{color:var(--muted);font-size:13px;text-decoration:none;padding:0 4px}
.spacer{flex:1}
button,select{font:inherit;border:0;border-radius:8px;height:34px;padding:0 12px;cursor:pointer;background:var(--chip);color:var(--ink)}
select{padding:0 8px;max-width:260px}
button:disabled,select:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.sz{display:flex;gap:4px}.sz button{width:34px;padding:0}
.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.status[data-s=live] .pill{background:var(--accent);animation:pulse 1.6s infinite}
.status[data-s=connecting] .pill,.status[data-s=reconnecting] .pill,.status[data-s=stopping] .pill{background:var(--warn)}
@keyframes pulse{50%{opacity:.3}}
#go{background:var(--accent);color:var(--accent-ink);font-weight:600;min-width:92px;display:flex;align-items:center;justify-content:center;gap:8px}
#go .dot{width:9px;height:9px;border-radius:50%;background:currentColor}
#go.rec .dot{border-radius:2px}
.sub{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;padding:5px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.sub code{font:12px var(--mono);color:var(--ink);word-break:break-all}
.sub button{height:24px;padding:0 8px;font-size:12px}
.warnText{color:var(--warn)}
#banner{display:none;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 14px;background:var(--chip);border-left:3px solid var(--warn);font-size:14px}
#banner.on{display:flex}
#banner button{height:28px;padding:0 10px;font-size:13px;background:var(--panel)}

/* 答案区：上方正中 */
body.aiTop #aiWrap{flex-direction:column}
body.aiTop #ai{order:-1;position:static;width:min(900px,calc(100% - 24px));margin:10px auto 0;max-height:62vh;border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.07)}
body.aiTop #ai .aiCards{padding:10px 14px}
body.aiTop #ai .aiCard:first-of-type .aiA{font-size:var(--pf)}
body.aiTop #ai .aiCard:first-of-type .aiZ{font-size:15px}
body.aiTop #ai .aiCard.old{opacity:.55}
body.aiTop #ai .aiCard.old .aiA{font-size:15px}
#aiSeg button[data-m=you]{display:none}
#pipNote{order:-1;width:min(900px,calc(100% - 24px));margin:10px auto 0;padding:12px 14px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:13px;text-align:center}

/* 转写 */
main{flex:1;overflow-y:auto;padding:6px 0 40px;min-height:120px}
#log{max-width:900px;margin:0 auto;padding:0 18px;font-size:var(--cap);line-height:1.5}
.line{display:grid;grid-template-columns:64px minmax(0,1fr);gap:0 12px;padding:3px 0}
.line .t{font:11px/1 var(--mono);color:var(--faint);text-align:right;padding-top:calc(var(--cap)*.45)}
.line .tx{min-width:0;overflow-wrap:anywhere}
.line.note .tx{font-size:12px;color:var(--muted);font-style:italic}
.spk{display:inline-block;font-size:11px;font-weight:650;line-height:1;padding:3px 6px;border-radius:5px;margin-right:7px;vertical-align:.15em;background:var(--chip);color:var(--muted)}
.spk.ask{color:var(--accent)}
.spk[data-r]{cursor:pointer}
#live .int{color:var(--muted)} #live.idle{display:none} #liveSpk:empty{display:none}
.empty{max-width:620px;margin:6vh auto 0;color:var(--muted);font-size:14px;line-height:1.75;padding:0 18px}
.empty b{color:var(--ink)}
.empty ol{padding-left:20px;margin:8px 0}

/* 材料 */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:20px;width:min(760px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h3{margin:0 0 4px;font-size:16px}
dialog h4{margin:18px 0 8px;font-size:14px;padding-top:12px;border-top:1px solid var(--line)}
dialog p{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.55}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;min-width:0}
.f>label{font-size:12px;color:var(--muted)}
.f input,.f textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px 10px;font:13px/1.45 var(--sans)}
.f input{height:36px}
.f textarea{resize:vertical;min-height:60px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.profRow{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.profRow select{flex:1;min-width:180px;max-width:none}
.files{display:flex;flex-direction:column;gap:4px;margin:2px 0 6px}
.file{display:flex;align-items:center;gap:8px;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.file .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .kd{font-size:11px;color:var(--muted)}
.file button{height:24px;width:24px;padding:0;font-size:11px;background:transparent;color:var(--faint)}
.addBtn{align-self:flex-start;height:30px;font-size:13px}
#mInfo{font-size:12px;color:var(--muted);min-height:1.3em;margin-top:4px;white-space:pre-line}
.rowEnd{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;flex-wrap:wrap}
.primary{background:var(--accent);color:var(--accent-ink)}

/* 悬浮窗里 */
body.pip{background:var(--panel);display:block}
body.pip #ai{width:100%;height:100vh;max-height:none;margin:0;border:0;border-radius:0;box-shadow:none}
body.pip #ai .aiCard.old,body.pip #ai .aiFoot{display:none}
body.pip #ai .aiBar{min-height:42px;padding:4px 10px}
body.pip #ai .aiTitle{display:none}

@media (max-width:700px){
  .grid2{grid-template-columns:1fr}
  header.top select{max-width:100%;flex:1 1 40%}
  .line{grid-template-columns:minmax(0,1fr)} .line .t{text-align:left;padding:0 0 2px}
}
</style>
</head>
<body class="iv">
<header class="top">
  <span class="brand">面试助手</span>
  <a class="back" href="./">← 课堂</a>
  <select id="prof" title="选这次是哪场面试"></select>
  <button id="matBtn" title="公司、职位、JD、research、简历">材料</button>
  <select id="src" title="面试官的声音从哪来">
    <option value="mix">视频面试：会议声音 + 麦克风</option>
    <option value="mic">只用麦克风（外放 / 面对面）</option>
  </select>
  <span class="spacer"></span>
  <div class="status" id="status" data-s="idle"><span class="pill"></span><span id="statusText">未开始</span></div>
  <div class="sz"><button id="pfSm" title="答案字号减小">A−</button><button id="pfLg" title="答案字号增大">A+</button></div>
  <button id="pipBtn" title="把答案放进一个总在最上层的小窗，拖到摄像头下面">悬浮窗</button>
  <button id="go"><span class="dot"></span><span id="goText">开始</span></button>
</header>
<div class="sub"><span>存到：<code id="file">—</code></span><span id="count"></span><span id="sync"></span><button id="dl" hidden>下载稿子</button></div>
<div id="banner"><span id="bannerText"></span><span class="spacer"></span><span id="bannerActions"></span></div>
<main id="main">
  <div id="log">
    <div class="empty" id="empty"></div>
    <div class="line idle" id="live"><span class="t" id="liveT"></span><span class="tx"><span class="spk" id="liveSpk"></span><span id="liveFin"></span> <span class="int" id="liveInt"></span></span></div>
  </div>
</main>

<dialog id="mat">
  <h3>面试材料</h3>
  <p>AI 回答时会参考这些（简历只用里面真有的经历，不编）。只存在这台电脑的浏览器里。</p>
  <div class="profRow"><select id="mProf"></select><button id="mNew">新建一场面试</button><button id="mDel">删除这场</button></div>
  <div class="grid2">
    <div class="f"><label for="mCompany">公司 / 机构</label><input id="mCompany" placeholder="如 Ropes &amp; Gray" autocomplete="off"></div>
    <div class="f"><label for="mPosition">职位</label><input id="mPosition" placeholder="如 2027 Summer Associate" autocomplete="off"></div>
  </div>
  <div class="f"><label for="mWho">面试官（名字、职位、背景，可留空）</label><input id="mWho" autocomplete="off"></div>
  <div class="f"><label for="mJD">职位描述 / JD（粘贴）</label><textarea id="mJD" rows="4"></textarea></div>
  <div class="f"><label for="mRes">我的 research（公司业务、近期 deal、practice group、面试官背景、想问他们的问题）</label><textarea id="mRes" rows="6"></textarea></div>
  <div class="f"><label>这场面试的文件（PDF、Word、txt、md；比如 research 报告）</label><div class="files" id="mFiles"></div><button class="addBtn" id="mAdd">＋ 上传文件</button></div>
  <h4>每场面试都用</h4>
  <div class="f"><label>简历</label><div class="files" id="cFiles"></div><button class="addBtn" id="cAdd">＋ 上传简历（PDF / Word）</button>
    <textarea id="cResume" rows="3" placeholder="或者直接把简历文字粘贴在这里"></textarea></div>
  <div class="f"><label for="cStories">我的故事 / 想强调的点（STAR 素材、why law、why this practice、职业规划）</label><textarea id="cStories" rows="5"></textarea></div>
  <div id="mInfo"></div>
  <div class="rowEnd"><button id="mCancel">取消</button><button class="primary" id="mSave">保存</button></div>
  <input type="file" id="fileIn" hidden multiple accept=".pdf,.docx,.txt,.md,application/pdf,text/plain,text/markdown">
</dialog>

<script>
/* ===================== AI 答题：听到老师提问 → 自动读最近的转写、用 Claude 想好答案 =====================
   页面只需要：AIQ.init({...}) 一次；每段定稿 AIQ.line(时间, 讲话人, 文本, 是否检查提问)；
   录音时每个 Deepgram final 片段 AIQ.heard(讲话人, 文本)；换稿子时 AIQ.reset()。 */
window.AIQ = (function(){
"use strict";
var QS = new URLSearchParams(location.search);
var ENDPOINT = QS.get("ai") || "https://api.anthropic.com/v1/messages";   // ?ai= 仅测试用
// 价格：美元 / 百万 token：[输入, 写缓存, 读缓存, 输出]（platform.claude.com 定价页，2026-11）
var MODELS = {
  "claude-sonnet-5-5": { name: "Sonnet 5.5", label: "Sonnet 5.5 · 推荐：快，答得好", p: [2, 2.5, 0.10, 10], max: 700,
                         extra: { thinking: { type: "between_tools" }, output_config: { effort: "medium" } } },
  "claude-haiku-5-5":  { name: "Haiku 5.5", label: "Haiku 5.5 · 最快、最便宜", p: [0.10, 0.125, 0.01, 0.50], max: 700,
                         extra: { thinking: { type: "disabled" }, output_config: { effort: "low" } } },
  "claude-opus-5-5":   { name: "Opus 5.5", label: "Opus 5.5 · 最强，慢几秒", p: [4, 5, 0.20, 20], max: 2500,
                         extra: { output_config: { effort: "low" } } }
};
var ORDER = ["claude-sonnet-5-5", "claude-haiku-5-5", "claude-opus-5-5"];
var GAP = 4000;          // 两次自动请求至少隔 4 秒（期间的新提问合并成一次）
var CH = 20;             // 转写按 20 段一块发送，前面的块不变 → 走提示缓存，便宜也更快
var MAXW = 9000, KEEPW = 4500, MAXCARDS = 12, STALE = 45;

var SYSTEM = [
  "You are Nolan's live answer assistant. Nolan is a 2L at the University of Minnesota Law School. You get a live, automatic speech-to-text transcript of his class or of a job interview, and you write what he can say out loud. He will read your answer aloud while people wait, so it has to sound natural when spoken.",
  "",
  "Every request is a question to answer. Never skip one and never ask for more context. The newest lines (and the line quoted at the end) contain the question. If that line is only a fragment, work out the full question from the lines around it. If it is not really a question, answer the most recent real question in the transcript; if there is none, answer the question Nolan is most likely to be asked next.",
  "",
  "Reply in exactly this format, with no preamble and no markdown:",
  "Q: <the question, cleaned up, at most 15 words>",
  "A: <the spoken answer: 2-4 sentences, about 40-70 words. The first sentence is the direct answer. Then the reason: the rule, test, case or statute and how it applies to the facts being discussed. If the professor is pushing back on a view, address the push-back.>",
  "中: <one short line in Chinese for Nolan: the key point, legal terms written as 中文（English）>",
  "",
  "How A must sound:",
  "- Like a well-prepared student talking in class: plain words, short sentences, contractions are fine, \"I think\" or \"I'd say\" is fine. No lists, no parentheses, no headings.",
  "- Write citations the way people say them: \"section 107\", \"the Feist case\", \"Rule 144\", not \"17 U.S.C. § 107\".",
  "- Ground it in what was said in this class first and general law second; reuse the professor's framing and terms.",
  "- Never invent case names, holdings, quotes or section numbers. If unsure of a citation, state the principle without one.",
  "- The transcript is automatic: expect misheard words (e.g. \"Wixis\" = WKSI, \"fare use\" = fair use) and wrong or shifting speaker labels (\"Prof\" is whoever talks most; \"Speaker N\" are others). Read through the errors.",
  "- If the setting is a job interview: answer as Nolan in the first person, about 60-110 words (up to 150 for \"tell me about yourself\" or \"walk me through your resume\"). Use his materials: tie the answer to this firm and role using the job description and his research. For a behavioral question, tell a compact STAR story. For \"Do you have any questions for us?\", give two specific questions drawn from his research.",
  "- About Nolan's own experience, use only facts in his resume and materials. Never invent jobs, deals, clients, numbers or stories. If nothing in his materials fits, answer honestly with what does fit, and say in the 中 line what is missing.",
].join("\n");
var MANUAL = "Nolan pressed the Answer button: answer the most recent question in the transcript, even if it is implicit or was asked a little earlier. If there is no question at all, give the question he is most likely to be cold-called on about what is being discussed right now, and answer that.";
var DEFAULT_NAMES = "Nolan, Zhu";

var LS = {
  get: function(k, d){ try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
var H = { course: function(){ return ""; }, meta: function(){ return null; }, partial: function(){ return null; }, mobile: false, key: "" };
var cfg = LS.get("aiCfg", {});                  // {key, model, names, about}
var mode = null;                                  // off 只转写 / you 叫到我才答 / all 听到提问都答
var hidden = LS.get("aiHidden", null);
var lines = [], base = 0, seen = {}, nSeen = 0, answered = [], busy = null, queued = null, qTimer = 0, lastFire = 0, blocked = "", flashT = 0;
var E = {};
var $ = function(id){ return document.getElementById(id); };
function pad(n){ return String(n).padStart(2, "0"); }
function now(){ return new Date().toTimeString().slice(0, 8); }
function today(){ var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function key(){ return String(cfg.key || H.key || "").trim(); }
function model(){ return MODELS[cfg.model] ? cfg.model : ORDER[0]; }
function isInterview(c){ return /interview|面试/i.test(c || ""); }
function curMode(){                              // 面试时「叫到我」= 全部答（问题都是问你的）
  var c = ""; try { c = H.course() || ""; } catch (e) {}
  return mode === "you" && isInterview(c) ? "all" : mode;
}
function names(){ return String(cfg.names == null ? DEFAULT_NAMES : cfg.names).split(/[,，;；\n]/).map(function(x){ return x.trim(); }).filter(function(x){ return x.length >= 2; }).slice(0, 6); }
function ready(){ return !!key() && !blocked; }
function wc(t){ return (String(t).match(/\S+/g) || []).length; }

/* ---------- 哪句话像提问（「right?」「can you hear me?」这类口头禅不算；其余检测到的都交给 Claude 回答） ---------- */
var FILLER = /^(right|okay|ok|yeah|yes|no|correct|huh|see|good|great|alright|all right|make sense|does that make sense|got it|you know|sorry|what|hello|hi|can you hear me|can everyone hear me|can you all hear me|is that clear|are we good|ready|questions|any questions|any other questions|any questions so far|go ahead|yes, go ahead|where was i|what time is it|is this on|how are you|how's everyone)\W*$/i;
var TAG = /,\s*(right|okay|ok|yeah|correct|huh|no|yes|you know|see|you see|isn't it|aren't they|didn't they|doesn't it|wasn't it|agreed)\W*$/i;
var CUE = /\b(what do you (all |guys )?think|what(?:'s| is) your (view|take|answer|position)|who can (tell|explain|give|remind)|who wants to|who would like to|can (?:someone|somebody|anyone|anybody)|could (?:someone|somebody|anyone|anybody)|does (?:anyone|anybody|someone|somebody)|(?:anyone|anybody) (?:want|care|have|know)|tell me (?:what|why|how|about|whether)|walk (?:me|us) through|talk (?:me|us) through|tell (?:me|us) about (?:a time|yourself|your)|describe (?:a time|a situation|how|what|your)|give (?:me|us) an example|share an example|why (?:do you want|are you interested|our firm|this firm|this role|law)|what (?:interests|attracted|draws) you|how do you (?:handle|deal|approach|manage)|what are your (?:strengths|weaknesses|goals)|where do you see yourself|i'd (?:love|like) to hear|explain (?:to me|to us|why|how|what)|give me (?:an?|the|one|some|your)|how would you|what would you|let's hear|your thoughts|any (?:thoughts|takers|volunteers)|volunteers?|raise your hand|talk to me about|help me out|take a (?:stab|shot|crack) at|how about you|what (?:is|was|are|were) the (?:holding|rule|test|issue|standard|answer|outcome|result|argument|reasoning|best argument))\b/i;
var CALL = /\b(?:Mr|Ms|Mrs|Mx|Miss)\.?\s+[A-Z][\w'’-]+/;
var ABBR = /\b(Mr|Ms|Mrs|Mx|Dr|Prof|St|Inc|Co|Corp|Ltd|No|Nos|v|vs|Sec|Art|Cir|Ct|al)\./g;
function sentences(t){
  var x = String(t).replace(ABBR, function(m){ return m.slice(0, -1) + "․"; });
  return (x.match(/[^.?!]+[.?!]*["”’)]?/g) || []).map(function(s){ return s.replace(/․/g, ".").trim(); }).filter(Boolean);
}
function near1(a, b){                 // 编辑距离 ≤ 1（Deepgram 常把名字听错一个字母）
  if (a === b) return true;
  var la = a.length, lb = b.length, i = 0, j = 0, d = 0;
  if (Math.abs(la - lb) > 1) return false;
  while (i < la && j < lb) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++d > 1) return false;
    if (la > lb) i++; else if (lb > la) j++; else { i++; j++; }
  }
  return d + (la - i) + (lb - j) <= 1;
}
function nameHit(s){
  var ns = names(); if (!ns.length) return false;
  var words = s.match(/[A-Za-z][A-Za-z'’-]*/g) || [], low = s.toLowerCase();
  return ns.some(function(n){
    var nl = n.toLowerCase();
    if (/\s/.test(nl)) return low.indexOf(nl) >= 0;
    return words.some(function(w){ var x = w.toLowerCase(); return x === nl || (nl.length >= 5 && /^[A-Z]/.test(w) && near1(x, nl)); });
  });
}
function score(s, iv){                // 0 不是；1 像提问；2 点名（Mr./Ms. X）；3 叫到你的名字（面试里叫名字是常事，不算）
  var n = wc(s); if (!n) return 0;
  if (!iv && nameHit(s)) return 3;
  var q = /\?\W*$/.test(s);
  if (CALL.test(s) && (q || CUE.test(s) || n <= 6)) return 2;
  if (q) {
    if (FILLER.test(s) || TAG.test(s)) return 0;
    if (n <= 2) return (/^[A-Z][a-z]+$/.test(s.replace(/[\s,.?!]/g, "")) || /^(anyone|anybody|thoughts|volunteers|why|how so|and|so)\b/i.test(s)) ? 1 : 0;
    return 1;
  }

var DLG = '<h3>AI 答题设置</h3>' +
  '<p>老师提问时，自动让 Claude 读最近的转写、写好答案。key 只存在这台设备的浏览器里，费用记在你自己的 Claude API 账户上（和 claude.ai 订阅分开）。</p>' +
  '<div class="aiF"><label for="aiKey">Claude API key（在 platform.claude.com/settings/keys 创建，sk-ant- 开头）</label><input id="aiKey" type="password" autocomplete="off" spellcheck="false"></div>' +

  '<div class="aiF"><label for="aiAbout">关于你（可留空；面试时用：经历、想突出的点）</label><textarea id="aiAbout" rows="3"></textarea></div>' +

function openDlg(){

function saveDlg(){
  cfg = { key: $("aiKey").value.trim(), model: $("aiModel").value, names: $("aiNames").value.trim(), about: $("aiAbout").value.trim() };

function testKey(){
  var k = $("aiKey").value.trim() || H.key, m = $("aiModel").value, out = $("aiTestOut"), t0 = Date.now();
  if (!k) { out.textContent = "先填 key。"; return; }
  out.textContent = "测试中…";
  var body = { model: m, max_tokens: MODELS[m].max, messages: [{ role: "user", content: "Reply with the single word OK." }] };
  Object.keys(MODELS[m].extra).forEach(function(x){ body[x] = MODELS[m].extra[x]; });
  fetch(ENDPOINT, { method: "POST", headers: headers(k), body: JSON.stringify(body) })
    .then(function(r){ return r.ok ? r.json() : r.text().then(function(t){ throw apiErr(r.status, t); }); })
    .then(function(){ out.textContent = "✓ 可用：" + MODELS[m].name + "，" + ((Date.now() - t0) / 1000).toFixed(1) + " 秒回应。"; })
    .catch(function(e){ out.textContent = "✗ " + (e instanceof TypeError ? "连不上 Claude（网络问题）。" : e.message); });

function setMode(m){

var PUB = {

    if (hidden === null) hidden = H.mobile && !key();    // 手机上没设置过就先不占地方
    if (H.layout === "top") { hidden = false; document.body.classList.add("aiTop"); }   // 面试页：答案固定在上方正中
    var st = document.createElement("style"); st.textContent = CSS; document.head.appendChild(st);
    var main = $("main"), wrap = document.createElement("div"); wrap.id = "aiWrap";
    main.parentNode.insertBefore(wrap, main); wrap.appendChild(main);

      '<button data-m="off" title="只转写，不自动调用 AI">关</button><button data-m="you" title="叫到你的名字才自动回答；面试时每个问题都答">叫到我</button><button data-m="all" title="听到提问就自动回答">全部</button></div>' +
      '<span class="aiAct" id="aiAct"></span><button class="aiAsk" id="aiAsk" title="马上回答最近的提问（快捷键 A）">答</button>' +
      '<button class="aiIcon" id="aiCfgBtn" title="AI 设置" aria-label="AI 设置">⚙︎</button><button class="aiIcon aiFoldBtn" id="aiFold" title="收起/展开" aria-label="收起或展开">▾</button></div>' +
      '<div class="aiCards" id="aiCards"><div class="aiEmpty" id="aiEmpty"></div></div><div class="aiFoot" id="aiFoot"></div>';
    wrap.appendChild(p);
    var dl = document.createElement("dialog"); dl.className = "aiDlg"; dl.id = "aiDlg"; dl.innerHTML = DLG; document.body.appendChild(dl);

    E = { panel: p, cards: $("aiCards"), empty: $("aiEmpty"), act: $("aiAct"), ask: $("aiAsk"), seg: $("aiSeg"), foot: $("aiFoot"), dlg: dl };
    E.seg.addEventListener("click", function(e){ var b = e.target.closest ? e.target.closest("button[data-m]") : null; if (b) setMode(b.dataset.m); });
    setMode(mode);
    E.ask.onclick = function(){ PUB.ask(); };
    $("aiCfgBtn").onclick = openDlg;
    $("aiFold").onclick = function(){ p.classList.toggle("fold"); resize(); };
    $("aiSave").onclick = saveDlg; $("aiCancel").onclick = function(){ dl.close(); }; $("aiTest").onclick = testKey;
    E.cards.addEventListener("click", function(e){
      var x = e.target.closest ? e.target.closest(".aiX") : null; if (!x) return;
      var card = x.closest(".aiCard");
      if (busy && busy.card.el === card) stopJob(busy, "dismiss");
      card.remove(); empty();
    });
    if (H.before || H.after) {                           // 顶栏上的「AI」开关
      var b = document.createElement("button"); b.className = "aiTgl"; b.id = "aiToggle"; b.textContent = "AI"; b.title = "显示/隐藏 AI 答题";
      if (H.before) H.before.parentNode.insertBefore(b, H.before); else H.after.parentNode.insertBefore(b, H.after.nextSibling);
      b.onclick = function(){ setHidden(!hidden); };
      E.tgl = b;
    }
    PUB.bindKeys(document);
    if (window.matchMedia("(max-width: 999px)").matches && H.layout !== "top") p.classList.add("fold");   // 窄屏：先只露一条，有答案才展开
    if (window.ResizeObserver) new ResizeObserver(resize).observe(p);
    window.addEventListener("resize", resize);
    setHidden(!!hidden); activity(); foot(); empty();
  },
  line: function(t, label, text, check){
    text = String(text || "").trim(); if (!text) return;
    lines.push({ t: t || now(), label: label || "", text: text, w: wc(text) });
    if (check && fresh(t)) consider(label, text);
  },
  heard: function(label, text){ consider(label, text); },
  bindKeys: function(doc){                       // A 键 = 答（悬浮窗里也能用）
    doc.addEventListener("keydown", function(e){
      if (e.metaKey || e.ctrlKey || e.altKey || e.isComposing) return;
      var t = e.target && e.target.tagName;
      if (/INPUT|TEXTAREA|SELECT/.test(t || "") || (e.target && e.target.isContentEditable) || document.querySelector("dialog[open]")) return;
      if (e.key === "a" || e.key === "A") { e.preventDefault(); PUB.ask(); }
    });
  },
  panel: function(){ return E.panel; },
  refresh: function(){ if (E.cards) { activity(); empty(); } },    // 换课后（面试/上课）更新面板提示
  ask: function(){ if (hidden) setHidden(false); trigger({ manual: true, you: false, cue: "" }); },
  reset: function(clearCards){
    lines = []; base = 0; seen = {}; nSeen = 0; queued = null; answered = []; batch = null;
    if (busy) stopJob(busy, "dismiss");
    if (clearCards && E.cards) { Array.prototype.forEach.call(E.cards.querySelectorAll(".aiCard"), function(c){ c.remove(); }); empty(); }
  },
  names: names,
  setHostKey: function(k){ H.key = String(k || ""); activity(); empty(); },
  exportCfg: function(){ return cfg.key ? { a: cfg.key, m: model(), n: cfg.names || "" } : null; },
  importCfg: function(o){
    if (!o || !o.a) return;
    cfg = { key: o.a, model: MODELS[o.m] ? o.m : ORDER[0], names: o.n || cfg.names || "", about: cfg.about || "" };
    LS.set("aiCfg", cfg);
  },
  open: function(){ openDlg(); },
  onCfg: null

return PUB;
})();

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var LS = {
  get: function(k, d){ try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
var QS = new URLSearchParams(location.search);
var DG = QS.get("dg") || "wss://api.deepgram.com/v1/listen";          // ?dg= 测试用
var cfg = LS.get("cfg", { key: "", url: "", pass: "" });             // 和课堂页共用：Deepgram key、存稿网址、口令
function pad(n){ return String(n).padStart(2, "0"); }
function clock(){ return new Date().toTimeString().slice(0, 8); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

/* ===================== 面试档案和材料 ===================== */
function blank(){ return { id: uid(), company: "", position: "", who: "", jd: "", research: "", files: [] }; }
var common = LS.get("ivCommon", { resume: "", stories: "", files: [] });
var profiles = LS.get("ivProfiles", []);
if (!profiles.length) profiles = [blank()];
var curId = LS.get("ivCur", profiles[0].id);
function cur(){ return profiles.filter(function(p){ return p.id === curId; })[0] || profiles[0]; }
function title(p){ return p.company ? p.company + (p.position ? " · " + p.position : "") : "（新的面试，点「材料」填）"; }
function course(){ var p = cur(); return "Interview - " + (p.company || "未命名"); }
function fillProf(sel, list, id){
  sel.textContent = "";
  list.forEach(function(p){ var o = document.createElement("option"); o.value = p.id; o.textContent = title(p); sel.appendChild(o); });
  sel.value = id;
}
function materials(){                          // 发给 Claude 的材料块（整场面试不变 → 走缓存）
  var p = cur(), t = [], pdfs = [];
  if (p.company) t.push("Firm / organization: " + p.company);
  if (p.position) t.push("Position: " + p.position);
  if (p.who) t.push("Interviewer(s): " + p.who);
  if (p.jd) t.push("Job description:\n" + p.jd);
  if (p.research) t.push("Nolan's research on the firm, role and interviewers:\n" + p.research);
  if (common.resume) t.push("Nolan's resume:\n" + common.resume);
  if (common.stories) t.push("Nolan's stories and the points he wants to make:\n" + common.stories);
  common.files.concat(p.files).forEach(function(f){
    var who = common.files.indexOf(f) >= 0 ? "Nolan's resume file" : "File for this interview";
    if (f.kind === "pdf") pdfs.push({ label: who + ": " + f.name, data: f.data });
    else if (f.text) t.push(who + " (" + f.name + "):\n" + f.text);
  });
  if (!t.length && !pdfs.length) return [];
  var blocks = [{ type: "text", text: "Interview materials from Nolan:\n\n" + (t.join("\n\n") || "(see attached PDFs)") }];
  pdfs.forEach(function(x){
    blocks.push({ type: "text", text: "Attached PDF - " + x.label });
    blocks.push({ type: "document", source: { type: "base64", media_type: "application/pdf", data: x.data } });
  });
  return blocks;
}

/* ----- 读文件：PDF 原样交给 Claude；Word 解压出文字；txt/md 直接读 ----- */
function b64(buf){
  var u = new Uint8Array(buf), s = "", CH = 0x8000;
  for (var i = 0; i < u.length; i += CH) s += String.fromCharCode.apply(null, u.subarray(i, i + CH));
  return btoa(s);
}
function inflateRaw(u8){
  if (!window.DecompressionStream) return Promise.reject(new Error("浏览器太旧，读不了 Word，请另存为 PDF"));
  return new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer().then(function(b){ return new Uint8Array(b); });
}
function docxText(buf){
  var dv = new DataView(buf), u8 = new Uint8Array(buf), i, dec = new TextDecoder();
  for (i = buf.byteLength - 22; i >= 0; i--) if (dv.getUint32(i, true) === 0x06054b50) break;
  if (i < 0) return Promise.reject(new Error("不是有效的 .docx"));
  var cnt = dv.getUint16(i + 10, true), off = dv.getUint32(i + 16, true);
  for (var n = 0; n < cnt; n++) {
    if (dv.getUint32(off, true) !== 0x02014b50) break;
    var method = dv.getUint16(off + 10, true), csize = dv.getUint32(off + 20, true);
    var nlen = dv.getUint16(off + 28, true), elen = dv.getUint16(off + 30, true), clen = dv.getUint16(off + 32, true), loff = dv.getUint32(off + 42, true);
    var name = dec.decode(u8.subarray(off + 46, off + 46 + nlen));
    if (name === "word/document.xml") {
      var start = loff + 30 + dv.getUint16(loff + 26, true) + dv.getUint16(loff + 28, true), data = u8.subarray(start, start + csize);
      return (method === 0 ? Promise.resolve(data) : inflateRaw(data)).then(function(x){
        return dec.decode(x).replace(/<w:tab\/>/g, "\t").replace(/<w:br\/>/g, "\n").replace(/<\/w:p>/g, "\n").replace(/<[^>]+>/g, "")
          .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, "\"").replace(/&apos;/g, "'").replace(/&amp;/g, "&")
          .replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
      });
    }
    off += 46 + nlen + elen + clen;
  }
  return Promise.reject(new Error("这个 .docx 里没找到正文"));
}
function readFile(f){
  var nm = f.name, low = nm.toLowerCase();
  if (f.size > 8 * 1024 * 1024) return Promise.reject(new Error(nm + " 太大（超过 8 MB）"));
  return f.arrayBuffer().then(function(buf){
    if (low.endsWith(".pdf") || f.type === "application/pdf") {
      if (f.size > 2.5 * 1024 * 1024) throw new Error(nm + " 超过 2.5 MB，浏览器存不下：压缩一下，或把文字粘贴进去");
      return { name: nm, kind: "pdf", size: f.size, data: b64(buf) };
    }
    if (low.endsWith(".docx")) return docxText(buf).then(function(t){ return { name: nm, kind: "text", size: f.size, text: t }; });
    if (low.endsWith(".doc")) throw new Error(nm + " 是旧版 Word：另存为 .docx 或 PDF 再传");
    return { name: nm, kind: "text", size: f.size, text: new TextDecoder().decode(buf).trim() };
  });
}

/* ----- 材料对话框（改的是草稿，点保存才生效） ----- */
var D = null, pickFor = "";
function openMat(){
  D = { profiles: JSON.parse(JSON.stringify(profiles)), common: JSON.parse(JSON.stringify(common)), cur: curId };
  loadDraft(); $("mInfo").textContent = ""; $("mat").showModal();
}
function dp(){ return D.profiles.filter(function(p){ return p.id === D.cur; })[0] || D.profiles[0]; }
function loadDraft(){
  var p = dp(); D.cur = p.id;
  fillProf($("mProf"), D.profiles, p.id);
  $("mCompany").value = p.company; $("mPosition").value = p.position; $("mWho").value = p.who; $("mJD").value = p.jd; $("mRes").value = p.research;
  $("cResume").value = D.common.resume; $("cStories").value = D.common.stories;
  renderFiles();
}
function keepDraft(){
  var p = dp();
  p.company = $("mCompany").value.trim(); p.position = $("mPosition").value.trim(); p.who = $("mWho").value.trim();
  p.jd = $("mJD").value.trim(); p.research = $("mRes").value.trim();
  D.common.resume = $("cResume").value.trim(); D.common.stories = $("cStories").value.trim();
}
function kb(n){ return n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }
function renderFiles(){
  [["mFiles", dp().files], ["cFiles", D.common.files]].forEach(function(x){
    var box = $(x[0]); box.textContent = "";
    x[1].forEach(function(f, i){
      var d = document.createElement("div"); d.className = "file";
      var nm = document.createElement("span"); nm.className = "nm"; nm.textContent = f.name;
      var kd = document.createElement("span"); kd.className = "kd"; kd.textContent = (f.kind === "pdf" ? "PDF，原文交给 Claude" : "文字 " + (f.text || "").length + " 字") + " · " + kb(f.size || 0);
      var rm = document.createElement("button"); rm.textContent = "✕"; rm.title = "移除"; rm.onclick = function(){ x[1].splice(i, 1); renderFiles(); };
      d.appendChild(nm); d.appendChild(kd); d.appendChild(rm); box.appendChild(d);
    });
  });
}
$("matBtn").onclick = openMat;
$("mProf").onchange = function(){ keepDraft(); D.cur = $("mProf").value; loadDraft(); };
$("mNew").onclick = function(){ keepDraft(); var p = blank(); D.profiles.unshift(p); D.cur = p.id; loadDraft(); $("mCompany").focus(); };
$("mDel").onclick = function(){
  var p = dp();
  if (!window.confirm("删除「" + title(p) + "」这场面试的材料？")) return;
  D.profiles = D.profiles.filter(function(x){ return x !== p; });
  if (!D.profiles.length) D.profiles = [blank()];
  D.cur = D.profiles[0].id; loadDraft();
};
$("mAdd").onclick = function(){ pickFor = "m"; $("fileIn").value = ""; $("fileIn").click(); };
$("cAdd").onclick = function(){ pickFor = "c"; $("fileIn").value = ""; $("fileIn").click(); };
$("fileIn").onchange = function(){
  var list = Array.prototype.slice.call(this.files || []), target = pickFor === "c" ? D.common.files : dp().files;
  if (!list.length) return;
  $("mInfo").textContent = "读取中…";
  Promise.all(list.map(function(f){ return readFile(f).catch(function(e){ return { err: e.message }; }); })).then(function(rs){
    var bad = [];

/* ===================== 录音：麦克风（+ 会议标签页的声音）→ Deepgram ===================== */
// 双声道：左 = 你的麦克风，右 = 会议声音。Deepgram 分声道转写，所以「谁在说」是确定的，不用猜。
var WORKLET = "class P extends AudioWorkletProcessor{constructor(o){super();this.k=o.processorOptions.ch;this.r=sampleRate/16000;this.p=0;this.s=new Float32Array(this.k);this.c=0;this.b=new Int16Array(1600*this.k);this.n=0}" +

  "if(this.p>=this.r){this.p-=this.r;for(var c=0;c<k;c++){var v=this.s[c]/this.c;this.s[c]=0;v=v<-1?-1:v>1?1:v;this.b[this.n++]=v<0?v*32768:v*32767}this.c=0;" +
  "if(this.n===this.b.length){this.port.postMessage(this.b.buffer,[this.b.buffer]);this.b=new Int16Array(1600*this.k);this.n=0}}}return true}}registerProcessor('pcmN',P);";

var backoff = 1000, failStreak = 0, hadDrop = false, dropAt = 0, keepId = 0, epoch = 0, keyterms = [];
var buf = {}, spk = { order: [], alias: {} };

function getTab(){

    video: true, audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, suppressLocalAudioPlayback: false },

    if (!s.getAudioTracks().length) { s.getTracks().forEach(function(t){ t.stop(); }); throw new Error("没勾选「分享标签页音频」"); }
    s.getVideoTracks().forEach(function(t){ t.enabled = false; });
    return s;
  });
}
function stopTracks(){
  [mic, tab].forEach(function(s){ if (s) s.getTracks().forEach(function(t){ try { t.stop(); } catch (e) {} }); });

}
function buildGraph(){

  }

function dgUrl(){
  var q = [["model", "nova-3"], ["language", "en"], ["smart_format", "true"], ["punctuate", "true"], ["interim_results", "true"],
           ["endpointing", "400"], ["utterance_end_ms", "1500"], ["encoding", "linear16"], ["sample_rate", "16000"], ["channels", String(nch)]];
  q.push(nch === 2 ? ["multichannel", "true"] : ["diarize", "true"]);
  keyterms.forEach(function(k){ q.push(["keyterm", k]); });

}
function start(){
  if ($("status").dataset.s !== "idle") return;
  cfg = LS.get("cfg", cfg);
  if (!cfg.key) { banner("还没有 Deepgram key：在课堂页 ⚙ 设置里填一次（同一个浏览器，两边共用）。", [["去课堂页", function(){ location.href = "./"; }]]); return; }
  var wantTab = $("src").value === "mix", my = ++sid;

/* ----- 一行一行拼起来；双声道时左 = Nolan，右 = Interviewer；单声道按讲话人区分 ----- */
function baseLabel(k){ var i = spk.order.indexOf(k); if (i < 0) { spk.order.push(k); i = spk.order.length - 1; } return "Speaker " + (i + 1); }
function label(ch, sp){

}
function B(ch){ return buf[ch] || (buf[ch] = { parts: [], t: null, label: "", rk: "" }); }

  var b = buf[ch]; if (!b || !b.parts.length) return;

var liveCh = 0;

function onMessage(ev){

  if (d.type !== "Results") return;
  var ch = d.channel_index ? d.channel_index[0] : 0, alt = ((d.channel && d.channel.alternatives) || [])[0];

    w.document.body.appendChild(panel);
    AIQ.bindKeys(w.document);
    $("pipBtn").setAttribute("aria-pressed", "true"); $("pipBtn").textContent = "收回悬浮窗";
    w.addEventListener("pagehide", function(){
      $("aiWrap").appendChild(panel); note2.remove(); pip = null;
      $("pipBtn").setAttribute("aria-pressed", "false"); $("pipBtn").textContent = "悬浮窗";
    });
  }).catch(function(e){ banner("打不开悬浮窗：" + e.message); });
}

/* ===================== 事件 / 初始化 ===================== */
$("go").onclick = function(){ if ($("status").dataset.s === "idle") start(); else stop(); };
$("pipBtn").onclick = openPip;
$("pfSm").onclick = function(){ setFont(LS.get("ivFont", 24) - 2); };
$("pfLg").onclick = function(){ setFont(LS.get("ivFont", 24) + 2); };
$("src").value = LS.get("ivSrc", "mix");
$("src").onchange = function(){ LS.set("ivSrc", $("src").value); };
$("main").addEventListener("scroll", function(){ var m = $("main"); stick = m.scrollHeight - m.scrollTop - m.clientHeight < 60; });
window.addEventListener("beforeunload", function(e){ if (mic) { e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("online", function(){ push(); });

setFont(LS.get("ivFont", 24));
AIQ.init({
  layout: "top", modeKey: "ivMode", defaultMode: "all", mobile: false,
  course: course,
  meta: function(){ return {}; },
  extra: materials,
  asker: isAsker,
  partial: function(){
    var ch = nch === 2 ? 1 : liveCh, b = buf[ch];
    return b && b.parts.length && isAsker(b.label) ? { label: b.label, text: b.parts.join(" ") } : null;
  }
});
afterProfile(); setStatus("idle"); setSync();
if (!cfg.key) banner("还没有 Deepgram key：在课堂页 ⚙ 设置里填一次（同一个浏览器，两边共用）。", [["去课堂页", function(){ location.href = "./"; }]]);
})();
</script>
